name: Build Wikie (iOS 6 armv7 + iOS 14 arm64)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      compatibility_min:
        description: "Compile-only minimum iOS for armv7 (4.3, 5.0, 5.1, 6.0); blank for a normal build. No release uploads when set."
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  THEOS: /home/runner/theos
  THEOS_CACHE_KEY: theos-linux-clang11-sdk93-sdk165-v2
  MBEDTLS_VERSION: "3.6.7"
  COMPATIBILITY_MIN: ${{ inputs.compatibility_min }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ios6-armv7
            scheme: ""
            suffix: ""
            artifact: Wikie-packages
          - name: ios14-arm64
            scheme: rootless
            suffix: "-arm64"
            artifact: Wikie-packages-arm64
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git libplist-utils libxml2 xz-utils python3 llvm

      - name: Restore Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: ${{ env.THEOS_CACHE_KEY }}

      - name: Install Theos, toolchain and the iOS 9.3 and 16.5 SDKs
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"

          echo "== toolchain =="
          curl -sSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            CLANG=$(find "$THEOS/toolchain" -type f -name clang -path '*/bin/*' | head -n1)
            echo "clang found at: $CLANG"
            ROOT=$(dirname "$(dirname "$CLANG")")
            mkdir -p "$THEOS/toolchain/linux"
            ln -sfn "$ROOT" "$THEOS/toolchain/linux/iphone"
          fi
          ls -la "$THEOS/toolchain/linux/iphone/bin" | head -n 40

          echo "== SDKs =="
          RELEASE=$(curl -sS https://api.github.com/repos/theos/sdks/releases/latest)
          for SDK in 9.3 16.5; do
            SDK_URL=$(echo "$RELEASE" | grep -o "https://[^\"]*iPhoneOS${SDK}\.sdk[^\"]*" | head -n1 || true)
            echo "SDK $SDK asset: $SDK_URL"
            if [ -n "$SDK_URL" ]; then
              curl -sSL "$SDK_URL" -o /tmp/sdk.archive
              (tar -xJf /tmp/sdk.archive -C "$THEOS/sdks/" 2>/dev/null || tar -xzf /tmp/sdk.archive -C "$THEOS/sdks/" 2>/dev/null || unzip -q /tmp/sdk.archive -d "$THEOS/sdks/")
            fi
            if [ ! -d "$THEOS/sdks/iPhoneOS${SDK}.sdk" ]; then
              echo "Falling back to sparse checkout of theos/sdks for $SDK"
              rm -rf /tmp/sdks
              git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
              (cd /tmp/sdks && git sparse-checkout set "iPhoneOS${SDK}.sdk")
              mv "/tmp/sdks/iPhoneOS${SDK}.sdk" "$THEOS/sdks/"
            fi
          done
          ls "$THEOS/sdks"

      - name: Toolchain diagnostics
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          which clang ld64 ldid || true
          clang --version || true
          ldd "$THEOS/toolchain/linux/iphone/bin/clang" | grep -i "not found" || echo "clang: all shared libraries resolved"
          ls "$THEOS/sdks/iPhoneOS9.3.sdk" | head

      - name: Patch the iOS 9.3 SDK
        run: |
          set -e
          TBIN="$THEOS/toolchain/linux/iphone/bin"
          if [ -x /usr/bin/plistutil ]; then
            ln -sf /usr/bin/plistutil "$TBIN/plistutil"
            plistutil --help >/dev/null 2>&1 && echo "plistutil OK" || echo "plistutil still broken"
          fi
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          if [ -d "$SDK" ]; then
            LIBSYS="$SDK/usr/lib/libSystem.tbd"
            test -f "$LIBSYS"
            for lib in $(grep -o "/usr/lib/system/lib[A-Za-z0-9_]*\.dylib" "$LIBSYS" | sort -u); do
              base="${lib%.dylib}"
              if [ ! -f "$SDK$base.tbd" ] && [ ! -f "$SDK$lib" ]; then
                mkdir -p "$(dirname "$SDK$base.tbd")"
                printf -- '---\narchs:           [ armv7, armv7s, arm64 ]\nplatform:        ios\ninstall-name:    %s\ncurrent-version: 1.0\ncompatibility-version: 1.0\nexports:\n  - archs:           [ armv7, armv7s, arm64 ]\n    symbols:         [ ]\n...\n' "$lib" > "$SDK$base.tbd"
                echo "stubbed $lib"
              fi
            done

            LIBC="$SDK/usr/lib/system/libsystem_c.tbd"
            ADD=""
            for sym in _memcpy _memset _memmove _memcmp _memchr _strchr _strcmp _strncmp _strlen _strnlen _bzero \
                       _strcpy _strncpy _strcat _strlcpy _strlcat _strstr _strrchr _strdup _memset_s _memset_pattern4 \
                       _memset_pattern8 _memset_pattern16 _strncasecmp _strcasecmp; do
              if ! grep -Eq "[[ ,]${sym}[], ]" "$LIBC" "$SDK/usr/lib/system/libsystem_platform.tbd"; then
                ADD="${ADD}${sym}, "
              fi
            done
            if [ -n "$ADD" ]; then
              echo "adding to libsystem_c.tbd: $ADD"
              sed -i "0,/symbols:            \[ /s//symbols:            [ ${ADD}/" "$LIBC"
              grep -c "_memcpy" "$LIBC"
            fi
          fi

      - name: Fetch Dependencies (mbedTLS and Zstd)
        run: |
          mkdir -p vendor/mbedtls vendor/zstd
          # Build Zstandard single file decompressor
          git clone --depth 1 https://github.com/facebook/zstd.git /tmp/zstd
          python3 /tmp/zstd/build/single_file_libs/combine.py -r /tmp/zstd/lib -o vendor/zstd/zstddeclib.c /tmp/zstd/build/single_file_libs/zstddeclib-in.c
          cp /tmp/zstd/lib/zstd.h vendor/zstd/
          # Fetch mbedTLS
          curl -sSL "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${{ env.MBEDTLS_VERSION }}/mbedtls-${{ env.MBEDTLS_VERSION }}.tar.bz2" -o /tmp/mbedtls.tar.bz2
          tar -xjf /tmp/mbedtls.tar.bz2 -C vendor/mbedtls --strip-components=1
          mv vendor/mbedtls/include/mbedtls/mbedtls_config.h vendor/mbedtls/include/mbedtls/mbedtls_config_default.h
          cp vendor/mbedtls_config_ios6.h vendor/mbedtls/include/mbedtls/mbedtls_config.h
          echo "mbedTLS sources: $(ls vendor/mbedtls/library/*.c | wc -l)"

      - name: Build (${{ matrix.name }})
        run: |
          set -eo pipefail
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          export THEOS=${{ env.THEOS }}
          EXTRA=()
          if [ -n "$COMPATIBILITY_MIN" ]; then
            case "$COMPATIBILITY_MIN" in
              4.3|5.0|5.1|6.0) ;;
              *) echo "Unsupported compatibility minimum"; exit 1 ;;
            esac
            if [ -z "${{ matrix.scheme }}" ]; then
              EXTRA+=("TARGET=iphone:clang:9.3:$COMPATIBILITY_MIN")
            fi
          fi
          if [ -n "${{ matrix.scheme }}" ]; then export THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}"; fi
          make clean || true
          make package FINALPACKAGE=1 "${EXTRA[@]}" -j"$(nproc)" -k 2>&1 | tee build.log
          APP=$(find .theos/_ -type d -name Wikie.app | head -n1)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls -la "$APP"

      - name: Make IPA
        run: |
          set -e
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          LDID=$(command -v ldid || find "$THEOS" -type f -name ldid | head -n1)
          "$LDID" -S"$GITHUB_WORKSPACE/Resources/entitlements.plist" "$APP/Wikie"
          VERSION=$(grep '^Version:' control | cut -d' ' -f2)
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload packages
          cp -a "$APP" /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qr9 "$GITHUB_WORKSPACE/packages/Wikie-$VERSION${{ matrix.suffix }}.ipa" Payload)
          ls -la packages/

      - name: Build offline ZIM regression test
        run: |
          set -e
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          if [ -n "${{ matrix.scheme }}" ]; then ARCH=arm64; SDK=16.5; MIN=14.0; else ARCH=armv7; SDK=9.3; MIN=${COMPATIBILITY_MIN:-5.0}; fi
          mkdir -p /tmp/zim-test-objects
          for SRC in tools/zim-selftest.m src/ZIM/*.m src/Protocol/KWZIMURLProtocol.m src/KWCommon.m; do
            clang -target $ARCH-apple-ios$MIN -isysroot "$THEOS/sdks/iPhoneOS$SDK.sdk" -fobjc-arc -fblocks -Wno-deprecated-declarations -Isrc -Isrc/ZIM -Isrc/Protocol -Isrc/Model -c "$SRC" -o "/tmp/zim-test-objects/$(basename "$SRC").o"
          done
          clang -target $ARCH-apple-ios$MIN -isysroot "$THEOS/sdks/iPhoneOS$SDK.sdk" -Os -c vendor/zstd/zstddeclib.c -o /tmp/zim-test-objects/zstd.o
          clang -target $ARCH-apple-ios$MIN -isysroot "$THEOS/sdks/iPhoneOS$SDK.sdk" /tmp/zim-test-objects/*.o -framework Foundation -framework UIKit -framework CoreFoundation -framework CFNetwork -lobjc -lz -o packages/zim-selftest${{ matrix.suffix }}
          if [ "$ARCH" = armv7 ]; then
            install_name_tool -change /System/Library/Frameworks/CFNetwork.framework/CFNetwork /System/Library/Frameworks/Foundation.framework/Foundation packages/zim-selftest ||
              llvm-install-name-tool -change /System/Library/Frameworks/CFNetwork.framework/CFNetwork /System/Library/Frameworks/Foundation.framework/Foundation packages/zim-selftest
          fi
          ldid -SResources/entitlements.plist packages/zim-selftest${{ matrix.suffix }}

      - name: Upload Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/*.ipa
            packages/*.deb

      - name: Upload Build Log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore

      - name: Publish packages to the CI prerelease
        if: inputs.compatibility_min == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view ci-build >/dev/null 2>&1 || \
            gh release create ci-build --prerelease --title "Latest CI build" \
              --notes "Automatic build of the latest commit (armv7 for iOS 6, arm64 for iOS 14-17). Not a stable release." || true
          gh release upload ci-build packages/*.ipa packages/*.deb packages/zim-selftest* --clobber
          echo "uploaded to the ci-build prerelease:"; ls -la packages/*.ipa packages/*.deb

      - name: Publish to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && inputs.compatibility_min == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "Wikie ${{ github.ref_name }}" \
              --notes "Release ${{ github.ref_name }}" || true
          gh release upload "${{ github.ref_name }}" packages/*.ipa packages/*.deb packages/zim-selftest* --clobber
